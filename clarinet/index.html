<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1b2433"><title>Bass Clarinet Practice</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#10161f;color:#e8eef6}
header{padding:8px 10px;background:#1b2433;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.ctl{display:flex;flex-wrap:wrap;gap:6px;padding:6px 8px;align-items:center;font-size:14px}
select,button,input{font-size:15px;border-radius:6px;border:1px solid #445;background:#243044;color:#fff;padding:5px 7px}
button.on{background:#2e7d4f}
.card{background:#182131;margin:6px 8px;border-radius:8px;padding:6px}
.lbl{font-size:12px;color:#9ab;margin-bottom:2px;display:flex;justify-content:space-between}
#kbwrap{overflow-x:auto}#staffwrap{overflow-x:auto}
#info{font-size:20px;text-align:center;font-weight:600}
svg text{font-family:system-ui,sans-serif}
</style></head><body>
<header><span>🎷 Bass Clarinet (B♭, low E♭)</span><span id="micout" style="font-size:13px"></span></header>
<div class="ctl">
 <select id="level"><option value="1">Level 1: Arpeggios &amp; scales</option><option value="2">Level 2: Jazz modes 🔒</option></select>
 <label><input type="checkbox" id="mastered"> Arpeggios mastered</label>
</div>
<div class="ctl">
 <select id="key"></select>
 <button id="kmode">Written key</button>
 <select id="type"></select>
 <select id="oct"><option value="1">1 octave</option><option value="2">2 octaves</option></select>
</div>
<div class="ctl">
 <button id="play">▶ Play</button>
 <label>♩=<input id="tempo" type="range" min="40" max="200" value="80" style="width:110px"> <span id="tv">80</span></label>
 <button id="mic">🎤 Mic</button>
</div>
<div id="info">—</div>
<div class="card"><div class="lbl"><span>Notation — WRITTEN pitch (treble clef)</span><span id="exname"></span></div><div id="staffwrap"><svg id="staff" height="130"></svg></div></div>
<div class="card"><div class="lbl"><span>Keyboard — CONCERT (sounding) pitch, M9 below written</span><span id="kbnote"></span></div><div id="kbwrap"><svg id="kb" height="90"></svg></div></div>
<div class="card"><div class="lbl"><span>Fingering (written note)</span><span id="fname"></span></div><svg id="fing" viewBox="0 0 360 230" width="100%"></svg></div>
<script>
"use strict";
const SH=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'],FL=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const FLATKEYS=[5,10,3,8,1,6];// F Bb Eb Ab Db Gb
const T=14, LOW=51, HIGH=84; // written range Eb3..C6
const TYPES1={major:['Major',[0,4,7],[0,2,4,5,7,9,11]],minor:['Minor',[0,3,7],[0,2,3,5,7,8,10]],blues:['Blues',[0,4,7,10],[0,3,5,6,7,10]],
 mpent:['Major pentatonic',[0,4,7],[0,2,4,7,9]],npent:['Minor pentatonic',[0,3,7],[0,3,5,7,10]],mscale:['Major scale',[0,4,7,11],[0,2,4,5,7,9,11]],nminor:['Natural minor',[0,3,7,10],[0,2,3,5,7,8,10]]};
const TYPES2={dorian:['Dorian',[0,3,7,10],[0,2,3,5,7,9,10]],mixo:['Mixolydian',[0,4,7,10],[0,2,4,5,7,9,10]],lydian:['Lydian',[0,4,7,11],[0,2,4,6,7,9,11]],
 phryg:['Phrygian',[0,3,7,10],[0,1,3,5,7,8,10]],locr:['Locrian',[0,3,6,10],[0,1,3,5,6,8,10]],bebop:['Bebop dominant',[0,4,7,10],[0,2,4,5,7,9,10,11]],alt:['Altered',[0,4,8,10],[0,1,3,4,6,8,10]]};
// Fingering table, WRITTEN midi -> [thumb,register,L1,L2,L3,R1,R2,R3,keys[],note]
// keys: Eb(low Eb ext), E,F,Fs (little-finger), Gs(LH G#), A(A key), Ab/Eb (RH pinky), s1..s4 RH side trill keys, Cs (LH C#/G# sliver)
const F={};function d(m,t,r,l,rr,k,n){F[m]={t,r,l,rr,k:k||[],n:n||''}}
d(51,1,0,[1,1,1],[1,1,1],['Eb'],'low E♭ key');d(52,1,0,[1,1,1],[1,1,1],['E']);d(53,1,0,[1,1,1],[1,1,1],['F']);d(54,1,0,[1,1,1],[1,1,1],['Fs']);
d(55,1,0,[1,1,1],[1,1,1]);d(56,1,0,[1,1,1],[1,1,1],['Ab']);d(57,1,0,[1,1,1],[1,1,0]);d(58,1,0,[1,1,1],[1,0,0]);
d(59,1,0,[1,1,1],[0,1,0],[],'fork (alt: T123 + side)');d(60,1,0,[1,1,1],[0,0,0]);d(61,1,0,[1,1,1],[0,0,0],['Cs'],'C♯/G♯ sliver');
d(62,1,0,[1,1,0],[0,0,0]);d(63,1,0,[1,0,0],[0,0,0],['s1'],'side key');d(64,1,0,[1,0,0],[0,0,0]);d(65,1,0,[0,0,0],[0,0,0]);
d(66,0,0,[1,0,0],[0,0,0]);d(67,0,0,[0,0,0],[0,0,0],[],'open G (throat)');d(68,0,0,[0,0,0],[0,0,0],['Gs'],'throat G♯');d(69,0,0,[0,0,0],[0,0,0],['A'],'throat A');
d(70,0,1,[0,0,0],[0,0,0],['A'],'throat B♭: A key + register');
for(let m=71;m<=82;m++){const c=F[m-19];d(m,1,1,c.l,c.r,c.k.filter(x=>x!=='Eb'),'clarion (12th of '+nm(m-19)+')')}
F[71].k=['E'];F[72].k=['F'];F[73].k=['Fs'];
d(81,1,1,[1,1,0],[0,0,0]);d(82,1,1,[1,0,0],[0,0,0]);d(83,1,1,[1,0,0],[0,0,0],['s3'],'side key 3');d(84,1,1,[1,0,0],[0,0,0],['s3','s4'],'side keys 3+4 (verify)');
function nm(m,fl){return (fl?FL:SH)[((m%12)+12)%12]+(Math.floor(m/12)-1)}
// state
let st={keyIdx:10,concert:false,type:'major',oct:1,notes:[],cur:-1,playing:false,timer:null};
const $=id=>document.getElementById(id);
function useFlats(pc){return FLATKEYS.includes(pc)||pc===0&&false}
function writtenKey(){return st.concert?(st.keyIdx+2)%12:st.keyIdx}
function buildSelectors(){const k=$('key');k.innerHTML='';for(let i=0;i<12;i++){k.innerHTML+=`<option value="${i}">${(useFlats(i)?FL:SH)[i]} ${st.concert?'(concert)':'(written)'}</option>`}k.value=st.keyIdx;
 const lv=$('level').value,tp=$('type'),T_=lv==='2'?TYPES2:TYPES1;tp.innerHTML='';for(const x in T_)tp.innerHTML+=`<option value="${x}">${T_[x][0]}</option>`;if(!T_[st.type])st.type=Object.keys(T_)[0];tp.value=st.type}
function gen(){const T_=$('level').value==='2'?TYPES2:TYPES1,[name,ch,sc]=T_[st.type];const pc=writtenKey();
 let root=pc;while(root<LOW)root+=12;if(root+12*st.oct>HIGH)root-=0;// fits for 1 oct; 2 oct may cap
 let top=Math.min(root+12*st.oct,HIGH);const arp=[],up=[];
 for(let o=0;o<st.oct;o++)for(const i of ch){const m=root+12*o+i;if(m<=HIGH)arp.push(m)}if(root+12*st.oct<=HIGH)arp.push(root+12*st.oct);
 for(let o=0;o<st.oct;o++)for(const i of sc){const m=root+12*o+i;if(m<=top)up.push(m)}if(root+12*st.oct<=HIGH)up.push(root+12*st.oct);
 const down=up.slice(0,-1).reverse();st.notes=[...arp,...arp.slice(0,-1).reverse(),...up,...down];st.flats=useFlats(pc)||['minor','nminor','npent','blues','dorian','phryg','locr','alt'].includes(st.type)&&[0,5,7,2].includes(pc);
 $('exname').textContent=`${(st.flats?FL:SH)[pc]} ${name} (written) = ${(useFlats((pc+10)%12)?FL:SH)[(pc+10)%12]} concert`;st.cur=-1;drawStaff();drawKb();drawFing(null)}
// staff
const LET={C:0,D:1,E:2,F:3,G:4,A:5,B:6};
function spell(m){const s=nm(m,st.flats);const L=s[0],acc=s.length>2&&!/\d/.test(s[1])?s[1]:'';const oct=parseInt(s.replace(/[^0-9-]/g,''));return{L,acc,oct}}
function drawStaff(){const sv=$('staff'),n=st.notes.length,dx=26,W=70+n*dx;sv.setAttribute('width',W);let h='';const y0=40,gap=8;// top line F5
 for(let i=0;i<5;i++)h+=`<line x1="0" x2="${W}" y1="${y0+i*gap}" y2="${y0+i*gap}" stroke="#ccd" />`;
 h+=`<text x="2" y="${y0+33}" font-size="44" fill="#ccd">𝄞</text>`;
 st.notes.forEach((m,i)=>{const s=spell(m),step=s.oct*7+LET[s.L],ref=5*7+LET.F;const y=y0+(ref-step)*gap/2,x=64+i*dx,col=i===st.cur?'#ffb300':'#e8eef6';
  for(let ly=y0+5*gap;ly<=y+0.1;ly+=gap)h+=`<line x1="${x-8}" x2="${x+8}" y1="${ly}" y2="${ly}" stroke="#ccd"/>`;
  for(let ly=y0-gap;ly>=y-0.1;ly-=gap)h+=`<line x1="${x-8}" x2="${x+8}" y1="${ly}" y2="${ly}" stroke="#ccd"/>`;
  if(s.acc)h+=`<text x="${x-17}" y="${y+5}" font-size="14" fill="${col}">${s.acc}</text>`;
  h+=`<g data-i="${i}" style="cursor:pointer"><rect x="${x-12}" y="0" width="24" height="130" fill="transparent"/><ellipse cx="${x}" cy="${y}" rx="5.5" ry="4.2" transform="rotate(-20 ${x} ${y})" fill="${col}"/>`+
   (step>=ref-4?`<line x1="${x-5}" x2="${x-5}" y1="${y}" y2="${y+26}" stroke="${col}"/>`:`<line x1="${x+5}" x2="${x+5}" y1="${y}" y2="${y-26}" stroke="${col}"/>`)+`</g>`});
 sv.innerHTML=h;sv.querySelectorAll('g[data-i]').forEach(g=>g.onclick=()=>select(+g.dataset.i,true));
 if(st.cur>=0){const w=$('staffwrap');w.scrollLeft=Math.max(0,64+st.cur*dx-w.clientWidth/2)}}
// keyboard concert 36..72
const KL=36,KH=72;function isB(m){return[1,3,6,8,10].includes(m%12)}
function drawKb(hl){const sv=$('kb'),ww=22;let wc=0,h='',bl='';const set=new Set(hl!=null?[hl]:[]);const ex=new Set(st.notes.map(m=>m-T));
 for(let m=KL;m<=KH;m++){if(!isB(m)){const x=wc*ww;h+=`<rect data-m="${m}" x="${x}" y="0" width="${ww-1}" height="86" fill="${set.has(m)?'#ffb300':ex.has(m)?'#cfe3ff':'#fff'}" stroke="#333"/>`;if(m%12===0)h+=`<text x="${x+3}" y="82" font-size="9" fill="#333">C${m/12-1}</text>`;wc++}
  else{const x=wc*ww-7;bl+=`<rect data-m="${m}" x="${x}" y="0" width="14" height="52" fill="${set.has(m)?'#ffb300':ex.has(m)?'#5577aa':'#111'}"/>`}}
 sv.setAttribute('width',wc*ww);sv.innerHTML=h+bl;sv.querySelectorAll('rect').forEach(r=>r.onclick=()=>{const m=+r.dataset.m+T;const i=st.notes.indexOf(m);if(i>=0)select(i,true);else show(m,true)});
 if(hl!=null){let c=0;for(let m=KL;m<hl;m++)if(!isB(m))c++;const w=$('kbwrap');w.scrollLeft=Math.max(0,c*ww-w.clientWidth/2)}}
// fingering diagram
function drawFing(m){const sv=$('fing'),f=m!=null?F[m]:null,on=v=>v?'#ffb300':'none',st_='#9ab';let h='';
 const hole=(x,y,v,lab)=>`<circle cx="${x}" cy="${y}" r="13" fill="${on(v)}" stroke="${st_}" stroke-width="2"/><text x="${x}" y="${y+28}" font-size="9" fill="#9ab" text-anchor="middle">${lab}</text>`;
 const key=(x,y,w,hh,k,lab)=>{const a=f&&f.k.includes(k);return`<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="5" fill="${a?'#ffb300':'#243044'}" stroke="${st_}"/><text x="${x+w/2}" y="${y+hh/2+4}" font-size="10" fill="${a?'#000':'#cde'}" text-anchor="middle">${lab}</text>`};
 h+=`<rect x="20" y="95" width="320" height="26" rx="13" fill="#2a3446"/>`;
 h+=`<circle cx="40" cy="45" r="13" fill="${on(f&&f.t)}" stroke="${st_}" stroke-width="2"/><text x="40" y="22" font-size="9" fill="#9ab" text-anchor="middle">Thumb</text>`;
 h+=`<rect x="62" y="35" width="26" height="20" rx="5" fill="${f&&f.r?'#ffb300':'#243044'}" stroke="${st_}"/><text x="75" y="28" font-size="9" fill="#9ab" text-anchor="middle">Register</text><text x="75" y="49" font-size="10" fill="${f&&f.r?'#000':'#cde'}" text-anchor="middle">R</text>`;
 ['L1','L2','L3'].forEach((l,i)=>h+=hole(70+i*40,108,f&&f.l[i],l));['R1','R2','R3'].forEach((l,i)=>h+=hole(210+i*40,108,f&&f.rr[i],l));
 h+=key(105,60,26,20,'A','A');h+=key(137,60,26,20,'Gs','G♯');h+=key(169,60,30,20,'Cs','C♯/G♯');
 h+=key(215,60,22,20,'s1','s1');h+=key(240,60,22,20,'s2','s2');h+=key(265,60,22,20,'s3','s3');h+=key(290,60,22,20,'s4','s4');
 h+=`<text x="60" y="160" font-size="9" fill="#9ab">LH little</text>`;h+=key(60,165,28,20,'E','E/B');h+=key(92,165,28,20,'F','F/C');h+=key(124,165,30,20,'Fs','F♯/C♯');
 h+=`<text x="210" y="160" font-size="9" fill="#9ab">RH little</text>`;h+=key(210,165,34,20,'Ab','A♭/E♭');h+=key(248,165,48,20,'Eb','low E♭');
 h+=`<text x="180" y="215" font-size="12" fill="#cde" text-anchor="middle">${f?(f.n||'standard Boehm fingering'):m!=null?'out of range':'tap a note'}</text>`;
 sv.innerHTML=h;$('fname').textContent=m!=null?nm(m,st.flats)+' written':''}
function show(m,snd){$('info').textContent=`Written ${nm(m,st.flats)}  •  Sounds ${nm(m-T,st.flats)} (${(440*2**((m-T-69)/12)).toFixed(1)} Hz)`;$('kbnote').textContent=nm(m-T,st.flats);drawKb(m-T);drawFing(m);if(snd)tone(m-T,0.6)}
function select(i,snd){st.cur=i;drawStaff();show(st.notes[i],snd)}
// audio: odd harmonics
let ac;function tone(mid,dur){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const f=440*2**((mid-69)/12),t=ac.currentTime,re=new Float32Array([0,1,0,.55,0,.35,0,.2,0,.12,0,.06]),im=new Float32Array(re.length);
 const o=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter();o.setPeriodicWave(ac.createPeriodicWave(re,im));o.frequency.value=f;lp.frequency.value=2200;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.04);g.gain.setValueAtTime(.3,t+dur*.8);g.gain.linearRampToValueAtTime(0,t+dur);o.connect(lp).connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.05)}catch(e){}}
function stop(){st.playing=false;clearTimeout(st.timer);$('play').textContent='▶ Play';$('play').classList.remove('on')}
function step(){if(!st.playing)return;const i=st.cur+1;if(i>=st.notes.length){stop();return}const b=60/+$('tempo').value;select(i,false);tone(st.notes[i]-T,b*.92);st.timer=setTimeout(step,b*1000)}
$('play').onclick=()=>{if(st.playing){stop();return}st.playing=true;st.cur=-1;$('play').textContent='■ Stop';$('play').classList.add('on');step()};
$('tempo').oninput=e=>$('tv').textContent=e.target.value;
$('key').onchange=e=>{st.keyIdx=+e.target.value;stop();gen()};$('type').onchange=e=>{st.type=e.target.value;stop();gen()};$('oct').onchange=e=>{st.oct=+e.target.value;stop();gen()};
$('kmode').onclick=()=>{st.concert=!st.concert;st.keyIdx=st.concert?(st.keyIdx+10)%12:(st.keyIdx+2)%12;$('kmode').textContent=st.concert?'Concert key':'Written key';buildSelectors();gen()};
const ms=$('mastered');ms.checked=localStorage.getItem('bcMastered')==='1';
function lvl(){const o=$('level').options[1];o.disabled=!ms.checked;o.text='Level 2: Jazz modes '+(ms.checked?'🔓':'🔒');if(!ms.checked)$('level').value='1'}
ms.onchange=()=>{localStorage.setItem('bcMastered',ms.checked?'1':'0');lvl();buildSelectors();gen()};$('level').onchange=()=>{stop();buildSelectors();gen()};
// mic
let mic=null;$('mic').onclick=async()=>{if(mic){mic.stop();mic=null;$('mic').classList.remove('on');$('micout').textContent='';return}
 try{const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});ac=ac||new AudioContext();await ac.resume();
 const src=ac.createMediaStreamSource(s),an=ac.createAnalyser();an.fftSize=4096;src.connect(an);const buf=new Float32Array(an.fftSize);let run=true,last=-1;
 mic={stop(){run=false;s.getTracks().forEach(t=>t.stop())}};$('mic').classList.add('on');
 (function loop(){if(!run)return;an.getFloatTimeDomainData(buf);const f=acf(buf,ac.sampleRate);if(f>0){const sm=69+12*Math.log2(f/440),r=Math.round(sm),wm=r+T,c=Math.round((sm-r)*100);
  $('micout').textContent=`${f.toFixed(1)}Hz ${nm(r)} ${c>=0?'+':''}${c}¢ → written ${nm(wm)}`;if(wm!==last){last=wm;const i=st.notes.indexOf(wm);if(i>=0){st.cur=i;drawStaff()}show(wm,false)}}requestAnimationFrame(loop)})()}
 catch(e){alert('Mic unavailable: '+e.message+' (needs https or file:// with permission)')}};
function acf(b,sr){let rms=0;for(const v of b)rms+=v*v;if(Math.sqrt(rms/b.length)<.01)return-1;const n=b.length,minL=Math.floor(sr/1000),maxL=Math.floor(sr/50);let best=-1,bv=0;const c=new Float32Array(maxL+2);
 for(let l=minL;l<=maxL+1;l++){let s=0;for(let i=0;i<n-l;i++)s+=b[i]*b[i+l];c[l]=s}let e0=0;for(const v of b)e0+=v*v;
 for(let l=minL+1;l<=maxL;l++)if(c[l]>c[l-1]&&c[l]>=c[l+1]&&c[l]>bv*1.0){if(c[l]>0.85*Math.max(...[bv]) || best<0){}if(c[l]>bv){bv=c[l];best=l}}
 // prefer first peak within 90% of the max (avoid octave errors)
 for(let l=minL+1;l<=maxL;l++)if(c[l]>c[l-1]&&c[l]>=c[l+1]&&c[l]>.9*bv){best=l;break}
 if(bv/e0<.3)return-1;const a=c[best-1],bb=c[best],cc=c[best+1],p=(a-cc)/(2*(a-2*bb+cc))||0;return sr/(best+p)}
lvl();buildSelectors();gen();select(0,false);
</script></body></html>
